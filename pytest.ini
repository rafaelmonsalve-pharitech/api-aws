[pytest]
# Pytest configuration for API Seven Arkeo Fleet

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests for isolated components
    integration: Integration tests with external dependencies
    slow: Tests that take more than 1 second to run

# Coverage options
[coverage:run]
source = src
omit = 
    tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
